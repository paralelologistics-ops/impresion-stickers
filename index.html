<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Stickers</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
    margin: 0;
    padding: 20px;
    background: #f4f4f4;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

select, button {
    padding: 10px;
    font-size: 14px;
}

.sheet {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
}

.label {
    border: 1px dashed #ccc;
    padding: 5px;
    font-size: 10px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>Generador de Stickers</h1>

<div class="controls">
    <select id="product-select"></select>
    <button onclick="loadProducts()">Cargar productos</button>
    <button onclick="generate()">Generar</button>
</div>

<div id="sheet" class="sheet"></div>

</div>

<script>

const productSelect = document.getElementById("product-select");
const sheet = document.getElementById("sheet");

function loadProducts() {

fetch("https://script.google.com/macros/s/AKfycbyEN5YfShY87f-eyuiR10-y3IJO0XYX8yCuxHUxVi8kgCmm3nwH9HoM4AYPrHfaPG5KkQ/exec")
.then(response => response.json())
.then(data => {

    productSelect.innerHTML = '<option value="">Selecciona producto</option>';

    data.forEach(item => {

        const option = document.createElement("option");

        option.value = item["Referencia"];
        option.textContent = item["Referencia"] + " - $" + format(item["Precio Nuevo Paralelo y Multimarcas"]);
        option.dataset.price = item["Precio Nuevo Paralelo y Multimarcas"];

        productSelect.appendChild(option);

    });

})
.catch(error => {
    console.error("Error:", error);
    alert("No se pudieron cargar los productos");
});

}

function generate() {

const selected = productSelect.options[productSelect.selectedIndex];

if (!selected.value) {
    alert("Selecciona un producto");
    return;
}

sheet.innerHTML = "";

for (let i = 0; i < 60; i++) {

    const div = document.createElement("div");
    div.className = "label";

    div.innerHTML = `
        <div><b>${selected.value}</b></div>
        <div>$${format(selected.dataset.price)}</div>
        <div>XS S M L XL</div>
    `;

    sheet.appendChild(div);
}

}

function format(price) {
    return parseInt(price).toLocaleString("es-CO");
}

</script>

</body>
</html>
